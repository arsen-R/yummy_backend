services:
  server:
    build:
      context: .
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/yummy
      - SPRING_DATASOURCE_USERNAME=arsen
      - SPRING_DATASOURCE_PASSWORD=29486
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      - POSTGRES_DB=yummy
      - POSTGRES_USER=arsen
      - POSTGRES_PASSWORD=29486

    volumes:
      - ./postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d db-name -U db-user" ]
      interval: 10s
      timeout: 5s
      retries: 5
