server:
  port: 8082
spring:
  application:
    name: Yummy
  datasource:
    name: postgres
    url: jdbc:postgresql:localhost:5432/yummy
    username: ${POSTGRES_USER:arsen}
    password: ${POSTGRES_PASSWORD:29486}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-Auto: create-drop
    defer-datasource-initialization: true
    showSql: true
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
  security:
    user:
      name: arsen
      password: arsenr412
  springdoc:
    api-docs:
      enabled: false

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          description:
            sql:
              BasicBinder: TRACE

application:
  security:
    jwt:
      secret-key: 5b4229ea4e3886d9fddafe27d0e6467f139970b0acb52701cb79d30823215027
      expiration: 900000
      cookie-name: jwt-cookie
      refresh-token:
        expiration: 1296000000
        cookie-name: refresh-jwt-cookie

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    endpoint:
      health:
        show-details: when-authorized
        show-components: always
    health:
      circuitbreakers:
        enabled: true
      ratelimiters:
        enabled: true